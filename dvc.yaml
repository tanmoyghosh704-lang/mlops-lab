stages:
  validate:
    cmd: python src/validate.py
    deps:
    - data/raw/sales.csv
    - src/validate.py
    outs:
    - data/validated/sales.csv
  prepare:
    cmd: python src/prepare.py
    deps:
    - data/validated/sales.csv
    - src/prepare.py
    params:
    - prepare.seed
    - prepare.test_size
    outs:
    - data/processed
  train:
    cmd: python src/train.py
    deps:
    - data/processed/test.csv
    - data/processed/train.csv
    - src/train.py
    params:
    - train.max_depth
    - train.min_samples_split
    - train.n_estimators
    - train.random_state
    outs:
    - models/random_forest.joblib
    metrics:
    - metrics/train_metrics.json
